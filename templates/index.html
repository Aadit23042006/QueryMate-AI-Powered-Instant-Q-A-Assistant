<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px;
        }
        .container {
            max-width: 800px; margin: 0 auto; background: white;
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden;
        }
        .header { background: #667eea; color: white; padding: 30px; text-align: center; }
        .header h1 { font-size: 28px; margin-bottom: 10px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .chat-container { padding: 20px; height: 400px; overflow-y: auto; background: #fafafa; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 8px; max-width: 85%; }
        .user-message { background: #667eea; color: white; margin-left: auto; }
        .ai-message { background: #e9ecef; color: #333; }
        .chat-input-section { padding: 20px; border-top: 1px solid #e0e0e0; }
        .chat-input-section input {
            width: 100%; padding: 15px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 16px; margin-bottom: 10px;
        }
        .chat-input-section button {
            width: 100%; padding: 15px; background: #667eea; color: white;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
        }
        .chat-input-section button:hover { background: #5568d3; }
        .chat-input-section button:disabled { background: #ccc; cursor: not-allowed; }
        .status { text-align: center; padding: 10px; font-size: 14px; color: #666; }
        .status.error { color: #e74c3c; }
        .status.success { color: #2ecc40; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Agent App</h1>
            <p>Ask any question and get instant AI-powered answers</p>
        </div>

        

        <div class="chat-container" id="chatContainer">
            <div class="message ai-message">
                Hello! I'm your AI assistant. Ask me anything!
            </div>
        <div class="chat-input-section">
            <input type="text" id="userInput" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" id="sendButton">Send</button>
        </div>
    </div>

    <script>
        let apiKeySet = true;

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const message = userInput.value.trim();

            if (!message) return;

            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';

            addMessage(message, 'user-message');
            userInput.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (data.success) {
                    addMessage(data.message, 'ai-message');
                } else {
                    addMessage('Error: ' + data.error, 'ai-message');
                    showStatus(data.error, 'error');
                }
            } catch (error) {
                addMessage('Error: ' + error.message, 'ai-message');
                showStatus(error.message, 'error');
            }

            sendButton.disabled = false;
            sendButton.textContent = 'Send';
        }

        function addMessage(text, className) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + className;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showStatus(text, type) {
            console.log(text);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
